<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="SankalpAI — a mental wellness companion. Daily check-ins, a tagged journal, habit streaks, and an AI that reflects your patterns back to you."
    />
    <meta name="theme-color" content="#ECE9FE" />
    <title>SankalpAI — Clarity That Powers Your Calm</title>
    <!--
      The hero background is the largest paint on the landing page, so it is
      requested alongside the stylesheet rather than after it. Split by media so
      only one of the two plates is ever fetched.
    -->
    <link
      rel="preload"
      as="image"
      href="/LightBackground.webp"
      type="image/webp"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="preload"
      as="image"
      href="/DarkBackground.webp"
      type="image/webp"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
