# Docker Compose - full stack orchestration.
# Brings up MySQL, the FastAPI backend, and the Vite dev server together.

services:
  mysql:
    image: mysql:8.0
    container_name: sankalp-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: sankalp
      MYSQL_USER: sankalp
      MYSQL_PASSWORD: sankalp
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # The backend starts before MySQL finishes initialising unless it
      # waits for a real connection, not just an open port.
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: sankalp-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: mysql+aiomysql://sankalp:sankalp@mysql:3306/sankalp
    volumes:
      - ./backend:/app
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    container_name: sankalp-frontend
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0

volumes:
  mysql-data:
