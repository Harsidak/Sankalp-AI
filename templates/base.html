<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sankalp: Youth Mental Health AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js",
        "firebase/database": "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js",
        "three": "{{ url_for('static', filename='js/three.module.js') }}"
      }
    }
    </script>
    <script>
        window.FIREBASE_CONFIG = {{ firebase_config | tojson | safe }};
    </script>
</head>

<body
    class="bg-bg-color text-text-primary antialiased selection:bg-accent-primary selection:text-white overflow-x-hidden">

    <!-- Backgrounds -->
    <div class="noise-overlay"></div>
    <div id="aurora-background">
        <div class="aurora-blob blob-1"></div>
        <div class="aurora-blob blob-2"></div>
        <!-- <div class="aurora-blob blob-3"></div> -->
    </div>
    <div id="background-canvas" class="floating-lines-container" style="position: fixed; top: 0; left: 0;"></div>

    <!-- Notification Container -->
    <div id="notification-container"
        class="fixed top-6 left-1/2 -translate-x-1/2 z-[100] flex flex-col gap-2 pointer-events-none"></div>

    <div class="min-h-screen w-full flex flex-col items-center justify-center p-0 font-sans text-primary relative z-10">
        <main class="w-full h-full transition-all duration-500">
            {% block content %}{% endblock %}
        </main>
    </div>

    <!-- Emergency Modal -->
    <div id="emergency-modal" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-black/90 backdrop-blur-xl" onclick="closeEmergencyModal()"></div>
        <div
            class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full max-w-sm glass-panel p-8 animate-enter text-center">
            <div
                class="w-16 h-16 rounded-full bg-red-500/10 flex items-center justify-center mx-auto mb-4 animate-pulse">
                <i class="fa-solid fa-triangle-exclamation text-3xl text-red-500"></i>
            </div>
            <h2 class="text-2xl font-bold mb-2 text-white">Emergency Support</h2>
            <p class="text-text-secondary mb-8 text-sm leading-relaxed">If you or someone you know is in immediate
                danger, please reach out to emergency services.</p>

            <div class="space-y-3">
                <a href="tel:112"
                    class="flex items-center justify-between p-4 rounded-2xl bg-white/5 hover:bg-red-500/20 border border-white/5 hover:border-red-500/30 transition-all group">
                    <span class="font-medium text-white group-hover:text-red-400">Emergency Services</span>
                    <span class="text-lg font-bold text-white group-hover:scale-105 transition-transform">112</span>
                </a>
                <a href="tel:988"
                    class="flex items-center justify-between p-4 rounded-2xl bg-white/5 hover:bg-red-500/20 border border-white/5 hover:border-red-500/30 transition-all group">
                    <span class="font-medium text-white group-hover:text-red-400">Suicide Lifeline</span>
                    <span class="text-lg font-bold text-white group-hover:scale-105 transition-transform">988</span>
                </a>
            </div>

            <button onclick="closeEmergencyModal()"
                class="mt-8 text-sm text-text-secondary hover:text-white transition-colors">Close</button>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}

    <script>
        // Global helper for emergency modal
        function openEmergencyModal() {
            document.getElementById('emergency-modal').classList.remove('hidden');
        }
        function closeEmergencyModal() {
            document.getElementById('emergency-modal').classList.add('hidden');
        }

        // Notifications (iOS dynamic island style)
        function addNotification(message, type = 'info') {
            const container = document.getElementById('notification-container');
            const notif = document.createElement('div');
            // Minimalist Glass Pill
            const icon = type === 'success' ? '<i class="fa-solid fa-check-circle text-accent-success"></i>'
                : type === 'error' ? '<i class="fa-solid fa-circle-exclamation text-accent-danger"></i>'
                    : '<i class="fa-solid fa-circle-info text-accent-primary"></i>';

            notif.className = `glass-panel px-6 py-3 rounded-full flex items-center gap-3 shadow-2xl backdrop-blur-2xl border border-white/10 animate-enter transform transition-all duration-500`;
            notif.innerHTML = `
                ${icon}
                <span class="text-sm font-medium text-white tracking-wide">${message}</span>
            `;

            container.appendChild(notif);

            // Auto dismiss
            setTimeout(() => {
                notif.style.opacity = '0';
                notif.style.transform = 'translateY(-20px) scale(0.9)';
                setTimeout(() => notif.remove(), 400);
            }, 3000);
        }
    </script>
</body>

</html>
