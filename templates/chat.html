{% extends "base.html" %}

{% block content %}
<div class="fixed inset-0 flex flex-col pt-20 pb-6 px-4 md:px-6 max-w-5xl mx-auto h-screen">

    <!-- Glass Chat Container -->
    <div class="flex-1 flex flex-col glass-panel overflow-hidden relative shadow-2xl">

        <!-- Header -->
        <header
            class="absolute top-0 left-0 right-0 p-4 z-20 flex items-center justify-between nav-glass bg-opacity-50">
            <div class="flex items-center gap-4">
                <a href="/dashboard"
                    class="w-10 h-10 rounded-full flex items-center justify-center hover:bg-white/10 transition-all text-white/70 hover:text-white">
                    <i class="fa-solid fa-chevron-left"></i>
                </a>
                <div>
                    <h2 id="chat-title" class="font-bold text-base tracking-wide text-white">Loading...</h2>
                    <div class="flex items-center gap-2 opacity-50 text-[10px] uppercase tracking-wider">
                        <span class="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"></span>
                        Online
                    </div>
                </div>
            </div>
            <div class="w-10"></div>
        </header>

        <!-- Messages -->
        <div id="messages-container" class="flex-1 p-6 overflow-y-auto space-y-6 pt-24 pb-24 scroll-smooth">
            <!-- Messages injected here -->
        </div>

        <!-- Floating Input Area -->
        <div class="absolute bottom-6 left-4 right-4 z-20">
            <form id="chat-form"
                class="glass-panel p-2 pl-4 flex items-center gap-2 shadow-lg border border-white/20 bg-black/40 backdrop-blur-xl">

                <input type="text" id="user-input" autocomplete="off" placeholder="Type a message..."
                    class="flex-1 bg-transparent border-none text-white placeholder-white/30 focus:ring-0 text-sm h-10">

                <button type="button" id="mic-btn"
                    class="w-10 h-10 rounded-full flex items-center justify-center text-white/50 hover:text-white hover:bg-white/10 transition-colors">
                    <i class="fa-solid fa-microphone"></i>
                </button>

                <button type="submit" id="send-btn" disabled
                    class="w-10 h-10 rounded-full btn-primary flex items-center justify-center shadow-lg disabled:opacity-50 disabled:grayscale transition-all transform hover:scale-105 active:scale-95">
                    <i class="fa-solid fa-arrow-up text-sm"></i>
                </button>
            </form>
        </div>

    </div>
</div>
{% endblock %}

{% block scripts %}
<script type="module">
    import { doc, getDoc, updateDoc, setDoc, collection, query, orderBy, limit, getDocs } from "firebase/firestore";

    const params = new URLSearchParams(window.location.search);
    const sessionId = params.get('sessionId');
    const container = document.getElementById('messages-container');
    const form = document.getElementById('chat-form');
    const input = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const micBtn = document.getElementById('mic-btn');
    const titleEl = document.getElementById('chat-title');

    let sessionData = null;
    let isRecording = false;
    let recognition = null;

    // Init
    window.addEventListener('userChanged', async (e) => {
        const user = e.detail.user;
        if (!user) { window.location.href = '/'; return; }

        if (!sessionId) {
            // Start New Session
            const newId = Date.now().toString();
            const url = new URL(window.location);
            url.searchParams.set('sessionId', newId);
            window.history.replaceState({}, '', url);

            sessionData = {
                messages: [],
                title: 'New Conversation',
                createdAt: Date.now(),
                selections: { language: 'en' } // Default
            };
            titleEl.textContent = "New Conversation";

            // Create init doc
            await setDoc(doc(window.db, 'users', user.uid, 'sessions', newId), sessionData);
        } else {
            await loadSession(user.uid, sessionId);
        }
    });

    // Fallback
    if (window.currentUser) {
        // Trigger manually if event missed
        window.dispatchEvent(new CustomEvent('userChanged', { detail: { user: window.currentUser } }));
    }

    async function loadSession(uid, sid) {
        try {
            const ref = doc(window.db, 'users', uid, 'sessions', sid);
            const snap = await getDoc(ref);
            if (!snap.exists()) {
                // Session invalid?
                window.location.href = '/chat';
                return;
            }
            sessionData = snap.data();
            titleEl.textContent = sessionData.title || "Conversation";
            renderMessages(sessionData.messages || []);
            scrollToBottom();
        } catch (e) {
            console.error(e);
            addNotification("Error loading chat", "error");
        }
    }

    // --- CONTEXT FETCHER ---
    async function getContext() {
        if (!window.currentUser) return {};
        const uid = window.currentUser.uid;
        let context = { name: window.currentUser.displayName || 'Friend', streak: 0, mood: null };

        try {
            // Fetch Streak
            const dashSnap = await getDoc(doc(window.db, 'users', uid, 'data', 'dashboard'));
            if (dashSnap.exists()) {
                context.streak = dashSnap.data().keyMetrics?.currentStreak || 0;
            }

            // Fetch Last Mood
            const moodRef = collection(window.db, 'users', uid, 'mood_logs');
            const q = query(moodRef, orderBy('createdAt', 'desc'), limit(1)); // Assuming createdAt or timestamp
            // Note: In dashboard I used 'timestamp'
            const q2 = query(moodRef, orderBy('timestamp', 'desc'), limit(1));
            const moodSnap = await getDocs(q2);
            if (!moodSnap.empty) {
                const d = moodSnap.docs[0].data();
                context.mood = { score: d.score, tags: d.tags };
            }
        } catch (e) { console.error("Context Error", e); }
        return context;
    }

    function renderMessages(msgs) {
        container.innerHTML = '';
        msgs.forEach(m => appendMessage(m.author, m.text));
    }

    function appendMessage(author, text) {
        const isUser = author === 'user';
        const div = document.createElement('div');
        div.className = `flex ${isUser ? 'justify-end' : 'justify-start'} animate-enter`;

        // Modern Minimalist Bubbles
        const bubbleClass = isUser
            ? 'bg-linear-to-br from-blue-600 to-indigo-600 text-white rounded-[24px] rounded-tr-sm shadow-lg border border-white/10'
            : 'bg-white/10 text-gray-100 rounded-[24px] rounded-tl-sm backdrop-blur-md border border-white/5';

        div.innerHTML = `
            <div class="max-w-[85%] md:max-w-[70%] p-4 px-5 ${bubbleClass} text-[15px] leading-relaxed relative group">
                ${text}
                <div class="text-[9px] opacity-40 mt-1 text-right font-mono tracking-widest">${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</div>
            </div>
        `;
        container.appendChild(div);
    }

    function scrollToBottom() {
        container.scrollTop = container.scrollHeight;
    }

    input.addEventListener('input', () => {
        sendBtn.disabled = !input.value.trim();
    });

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const text = input.value.trim();
        if (!text) return;

        input.value = '';
        sendBtn.disabled = true;

        // Optimistic UI
        appendMessage('user', text);
        scrollToBottom();

        // Push user message
        if (!sessionData.messages) sessionData.messages = [];
        sessionData.messages.push({ author: 'user', text });

        // Typing indicator with physics bounce
        const typingDiv = document.createElement('div');
        typingDiv.id = 'typing-indicator';
        typingDiv.className = "flex justify-start animate-enter mb-2";
        typingDiv.innerHTML = `
            <div class="border border-white/5 p-4 flex items-center gap-1.5 h-[50px] bg-white/5 text-gray-100 rounded-[24px] rounded-tl-sm backdrop-blur-md shadow-lg">
                 <span class="w-1.5 h-1.5 bg-white/60 rounded-full animate-bounce"></span>
                 <span class="w-1.5 h-1.5 bg-white/60 rounded-full animate-bounce delay-100"></span>
                 <span class="w-1.5 h-1.5 bg-white/60 rounded-full animate-bounce delay-200"></span>
            </div>`;
        container.appendChild(typingDiv);

        // Smooth scroll to bottom
        requestAnimationFrame(() => {
            container.scrollTo({ top: container.scrollHeight, behavior: 'smooth' });
        });

        // Award XP
        if (window.addXP) window.addXP(2, "Message Sent");

        try {
            const context = await getContext();
            const response = await fetch('/api/chat_stream', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    messages: sessionData.messages,
                    language: sessionData.selections?.language || 'en',
                    context: context
                })
            });

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let aiText = '';

            // Allow dynamic update of last message
            typingDiv.remove();
            appendMessage('ai', '');
            const bubbles = document.querySelectorAll('#messages-container > div');
            const aiBubble = bubbles[bubbles.length - 1].querySelector('div'); // inner div

            // Reset content to just text initially
            aiBubble.innerHTML = '';

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                const chunk = decoder.decode(value);
                const lines = chunk.split('\n');
                for (const line of lines) {
                    if (!line.trim()) continue;
                    try {
                        const json = JSON.parse(line);
                        if (json.text) {
                            aiText += json.text;
                            // Re-render with timestamp protection
                            aiBubble.innerHTML = `
                                ${aiText}
                                <div class="text-[9px] opacity-40 mt-1 text-right font-mono tracking-widest">${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</div>
                            `;
                            scrollToBottom();
                        }
                    } catch (err) {
                        console.error("Stream parse error", err);
                    }
                }
            }

            // Save to DB
            sessionData.messages.push({ author: 'ai', text: aiText });
            const ref = doc(window.db, 'users', window.currentUser.uid, 'sessions', sessionId);
            await updateDoc(ref, { messages: sessionData.messages });

        } catch (err) {
            console.error(err);
            typingDiv.remove();

            // Check if it's a rate limit error or network
            if (err.message && err.message.includes('429')) {
                addNotification('You are typing too fast. Please wait a moment.', 'error');
            } else {
                addNotification('Connection interrupted. Please try again.', 'error');
            }
        } finally {
            sendBtn.disabled = !input.value.trim();
        }
    });

    // Speech Rec
    if ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.lang = 'en-US';

        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            input.value = transcript;
            sendBtn.disabled = false;
        };

        recognition.onend = () => {
            isRecording = false;
            micBtn.classList.remove('text-red-500', 'animate-pulse');
            micBtn.classList.add('text-white/50');
        };

        micBtn.addEventListener('click', () => {
            if (isRecording) {
                recognition.stop();
            } else {
                recognition.start();
                isRecording = true;
                micBtn.classList.remove('text-white/50');
                micBtn.classList.add('text-red-500', 'animate-pulse');
            }
        });
    } else {
        micBtn.style.display = 'none';
    }
</script>
{% endblock %}
