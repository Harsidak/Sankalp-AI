# Same port as the Python backend, so the React Vite proxy works unchanged.
server.port=8000

# Same MySQL database the Python backend uses (tables already exist).
# Override with environment variables: DB_URL, DB_USER, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/sankalp}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Do not create or change tables - the schema is owned by Alembic (Python).
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Java is camelCase, the React app expects snake_case JSON (mood_score, ...)
spring.jackson.property-naming-strategy=SNAKE_CASE

# AI module: any OpenAI-compatible API (OpenAI, NVIDIA NIM, ...)
ai.api-key=${AI_API_KEY:}
ai.base-url=${AI_BASE_URL:https://api.openai.com/v1}
ai.model=${AI_MODEL:gpt-4o-mini}

# Auth module. The secret must be at least 32 bytes for HS256; use JWT_SECRET
# in real deployments so tokens are interchangeable with the Python backend.
jwt.secret=${JWT_SECRET:change-me-to-a-long-random-string-of-at-least-32-chars}
jwt.access-token-minutes=${JWT_ACCESS_MINUTES:15}
jwt.refresh-token-days=${JWT_REFRESH_DAYS:7}
